<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GQN Dashboard</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --text-color: #ffffff;
            --card-bg: rgba(255, 255, 255, 0.05);
            --primary: #2481cc;
            --danger: #ff4757;
        }
        body {
            background-color: var(--telegram-theme-bg-color, var(--bg-color));
            color: var(--telegram-theme-text-color, var(--text-color));
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .card {
            background: var(--telegram-theme-secondary-bg-color, var(--card-bg));
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .header {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .metric {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            font-size: 16px;
        }
        .chart-container {
            position: relative;
            height: 180px;
            width: 100%;
        }
        button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background-color: var(--telegram-theme-button-color, var(--primary));
            color: var(--telegram-theme-button-text-color, #fff);
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button.danger {
            background-color: var(--danger);
        }
    </style>
</head>
<body>

    <div class="header">🖥️ System Dashboard</div>

    <div class="card">
        <div class="metric"><span>CPU Usage:</span> <span id="cpu-val">--%</span></div>
        <div class="chart-container">
            <canvas id="cpuChart"></canvas>
        </div>
    </div>

    <div class="card">
        <div class="metric"><span>RAM Usage:</span> <span id="ram-val">--%</span></div>
        <div class="chart-container">
            <canvas id="ramChart"></canvas>
        </div>
    </div>

    <div class="card">
        <button onclick="refreshData()">🔄 Refresh Data</button>
        <button class="danger" onclick="closeApp()">✖️ Close</button>
    </div>

    <script>
        // Init Telegram WebApp
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();

        let cpuData = [];
        let ramData = [];
        let labels = [];
        const maxPoints = 10;

        const ctxCpu = document.getElementById('cpuChart').getContext('2d');
        const cpuChart = new Chart(ctxCpu, {
            type: 'line',
            data: { labels: labels, datasets: [{ label: 'CPU %', data: cpuData, borderColor: '#ff4757', backgroundColor: 'rgba(255, 71, 87, 0.2)', fill: true, tension: 0.4 }] },
            options: { responsive: true, maintainAspectRatio: false, scales: { y: { min: 0, max: 100 } }, plugins: { legend: { display: false } } }
        });

        const ctxRam = document.getElementById('ramChart').getContext('2d');
        const ramChart = new Chart(ctxRam, {
            type: 'line',
            data: { labels: labels, datasets: [{ label: 'RAM %', data: ramData, borderColor: '#2ed573', backgroundColor: 'rgba(46, 213, 115, 0.2)', fill: true, tension: 0.4 }] },
            options: { responsive: true, maintainAspectRatio: false, scales: { y: { min: 0, max: 100 } }, plugins: { legend: { display: false } } }
        });

        async function refreshData() {
            try {
                // Lấy API từ chính domain hiện tại
                const response = await fetch('/api/status');
                const data = await response.json();
                
                document.getElementById('cpu-val').innerText = data.cpu + '%';
                document.getElementById('ram-val').innerText = data.ram + '%';

                const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                
                if (labels.length > maxPoints) {
                    labels.shift();
                    cpuData.shift();
                    ramData.shift();
                }
                
                labels.push(timeStr);
                cpuData.push(data.cpu);
                ramData.push(data.ram);

                cpuChart.update();
                ramChart.update();
            } catch (err) {
                console.error("Error fetching status", err);
            }
        }

        function closeApp() {
            window.Telegram.WebApp.close();
        }

        // Auto refresh every 5 seconds
        setInterval(refreshData, 5000);
        refreshData();
    </script>
</body>
</html>
